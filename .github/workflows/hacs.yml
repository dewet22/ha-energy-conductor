name: HACS

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN; validation only, nothing writes to the repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs — see test.yml for rationale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
