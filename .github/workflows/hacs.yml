name: HACS

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN; validation only, nothing writes to the repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs — see test.yml for rationale.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
