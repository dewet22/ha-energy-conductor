name: test

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN; nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (mutable tags/branches can be
      # force-pushed or compromised). Dependabot keeps the pins fresh.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest --cov --cov-fail-under=90 --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Surface upload failures (token problems, endpoint issues) instead of
          # passing CI silently.
          fail_ci_if_error: true

  # The bundled dashboard cards (ec-tape/ledger/longterm/strategy.js) carry a
  # vitest suite that, until now, only ran locally — a JS regression could merge
  # with green CI. This job gates it like pytest gates the Python side.
  js-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match the rest of this workflow (mutable tags can be moved).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
