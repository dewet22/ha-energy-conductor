[project]
name = "energy-conductor"
version = "0.1.0"
description = "Entity-driven energy coordination for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "dewet22", email = "dewet22@users.noreply.github.com" }]
dependencies = []

[project.urls]
Repository = "https://github.com/dewet22/ha-energy-conductor"
Issues = "https://github.com/dewet22/ha-energy-conductor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_conductor"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "coverage[toml]>=7.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID", "DTZ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"homeassistant".msg = "energy_conductor core must not import from homeassistant"

[tool.ruff.lint.per-file-ignores]
"custom_components/**" = ["TID251"]
"tests/integration/**" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/core"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/energy_conductor"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
